<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#e8612d" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>BizMart - Campus Store</title>
    <meta name="description" content="Your one-stop mobile school store for students">
    <!-- Load OneSignal SDK early -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Initialize OneSignal as early as possible
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        console.log("[OneSignal] SDK loaded and initialized");
        await OneSignal.init({
          appId: "56883e62-5aae-4486-b9c3-84e5e1db41c9",
          // Optional: Configure notification behavior
          allowLocalhostAsSecureOrigin: true,
          // Debug mode for development
          debug: true,
        });
        console.log("[OneSignal] Init complete");
      });
    </script>
    <meta name="author" content="Lovable" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://shop-campus-learn.lovable.app/og-image.jpeg">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BizMart" />
    <meta name="twitter:image" content="https://shop-campus-learn.lovable.app/og-image.jpeg">
    <meta property="og:title" content="BizMart - Campus Store">
  <meta name="twitter:title" content="BizMart - Campus Store">
  <meta property="og:description" content="Your one-stop mobile school store for students">
  <meta name="twitter:description" content="Your one-stop mobile school store for students">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Debug script to check OneSignal loading -->
    <script>
      // Check if OneSignal loaded after 5 seconds
      setTimeout(() => {
        if (!window.OneSignal) {
          console.error("[OneSignal] SDK failed to load after 5 seconds");
        } else {
          console.log("[OneSignal] SDK is available:", window.OneSignal);
        }
      }, 5000);
    </script>
  </body>
</html>
